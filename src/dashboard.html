<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><title>Kindle 本机主页</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font:20px/1.35 sans-serif;-webkit-text-size-adjust:100%}main,section,header{display:block}main{padding:10px;max-width:600px;margin:auto}header{height:52px;border-bottom:2px solid;text-align:center}h1{display:inline;font-size:24px;line-height:44px}h2{font-size:23px;margin:8px 0}button,input,textarea,select{font:20px sans-serif;color:#000;background:white;border:1px solid black;border-radius:0}button{min-height:40px;padding:4px 8px;margin:2px}button:disabled{color:#888;border-color:#bbb}button.selected{background:black;color:white}#library{float:left}#rollback{float:right}textarea{display:block;width:100%;padding:6px;resize:none;height:64px}section{border-bottom:2px solid;padding-bottom:8px}.months{width:100%;table-layout:fixed;border-collapse:collapse}.monthWrap{width:50%;vertical-align:top;padding:0 3px}.month{width:100%;border-collapse:collapse;table-layout:fixed}.month caption{font-size:20px;font-weight:bold;padding:4px}.month th{font-size:15px;font-weight:normal}.month td{height:32px;text-align:center}.month button{width:100%;height:32px;min-height:32px;padding:0;margin:0;border:0;font-size:19px}.month .today{outline:1px solid;outline-offset:-2px}.month .hasMemo{font-weight:bold;text-decoration:underline}.calnav{text-align:center;height:38px}.calnav button{min-height:32px;font-size:18px}.left{float:left}.right{float:right}.small{font-size:17px}.hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:25px;font-size:18px;margin:4px 0}.recorder{border:2px solid;padding:5px;margin:6px 0}.recorder button{min-width:22%;margin:0 1% 0 0}.menus button{font-size:18px;min-height:36px}.hidden{display:none!important}.list{max-height:200px;overflow:auto;border-top:1px solid;padding-top:5px}.list button{display:block;width:98%;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.memohead{height:37px;font-size:18px;line-height:34px}#save{float:right;min-height:32px;font-size:18px}#answer{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:20px;margin:4px 0}#question{height:56px}#devices{width:100%;height:40px}a{color:black}
</style></head><body><main>
<header><button id="library">书库／看书</button><h1>我的桌面</h1><button id="rollback">退出主页</button></header>
<section id="memoPane"><div class="calnav"><button id="previous" class="left">‹ 上月</button><button id="today">今天</button><button id="next" class="right">下月 ›</button></div><table class="months"><tr><td id="month0" class="monthWrap"></td><td id="month1" class="monthWrap"></td></tr></table><div class="memohead"><span id="selectedDate"></span><span id="saveStatus"></span><button id="save">保存备忘</button></div><textarea id="memo" maxlength="2000" placeholder="写下这一天的备忘…"></textarea></section>
<section id="voice"><h2>录音机</h2><div class="recorder"><button id="record" disabled>● 录音</button><button id="stopRecord" disabled>■ 保存</button><button id="playRecord" disabled>▶ 回放</button><button id="stopPlay" disabled>停止</button></div><div class="menus"><button id="recordings">录音列表</button><button id="music">本地音乐</button><button id="tabSettings">设置</button></div><p id="audioStatus" class="hint">正在检查耳机…</p><div id="mediaList" class="list hidden"></div><p id="mediaStatus" class="hint hidden"></p>
<div id="settingsPane" class="hidden"><button id="beginSession">恢复自动连接</button><button id="endSession">暂停自动连接</button><button id="settings">系统设置</button><button id="pair">配对耳机</button><button id="refreshDevices">耳机列表</button><select id="devices"></select><button id="selectDevice">使用此耳机</button><button id="tap">点击测试：0</button><button id="reload">刷新页面</button><p id="menuStatus" class="small">手动启动；本机录放与看书无需联网。</p></div></section>
<section id="qqPanel"><h2>QQ 音乐</h2><div class="menus"><button id="qqOpen">打开官网</button><button id="qqLocal">本地歌曲</button><button id="qqStop">停止本地播放</button></div><p class="hint">官网可显示，点歌暂不可用；本地支持 MP3/WAV</p><div id="musicList" class="list hidden"></div><p id="musicStatus" class="hint hidden"></p></section>
<section id="ai"><h2>DeepSeek · 文本</h2><textarea id="question" maxlength="2000" placeholder="输入问题；配置 API Key 后即可发送"></textarea><div class="menus"><button id="textSend" disabled>发送</button><button id="textClear">新对话</button><button id="textRefresh">检查配置</button></div><p id="aiStatus" class="hint">尚未配置 API Key</p><div id="answer"></div></section>
<div class="hidden"><button id="tabVoice"></button><button id="tabMemo"></button><input id="target"><button id="setDate"></button><p id="countdown"></p></div>
</main><script>__SCRIPT__</script></body></html>
